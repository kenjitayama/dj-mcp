name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  test-with-djdb:
    name: test with optional deps (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      # npm skips djdb-mcp without an error on Node 20/22 (its engines) and while its tag is missing.
      - name: Report whether djdb-mcp was installed
        run: |
          if [ -f node_modules/@kenjitayama/djdb-mcp/package.json ]; then
            echo "djdb-mcp $(node -p "require('./node_modules/@kenjitayama/djdb-mcp/package.json').version") installed"
          else
            echo "::warning::djdb-mcp was not installed on Node ${{ matrix.node }}; this job ran without it"
          fi
      - run: npm test
